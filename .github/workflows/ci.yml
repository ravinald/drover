name: CI

# Every branch, not only main. drover's merge gate reads the check runs for a
# branch head and opens a pull request only once they are green, so a workflow
# that fired on `pull_request` alone would report nothing until the document its
# answer decides already existed.
#
# pull_request stays for forks, where no push event reaches this repository. For
# a branch here the push event already gated the same head, so the job skips the
# pull_request run unless the head is a fork; the merge gate accepts a skipped
# check. The concurrency group serializes repeated pushes to one ref.
# cancel-in-progress is false because a cancelled required check never satisfies
# branch protection, and `gh pr merge --auto` would wait on one forever.
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The SECURITY.md supported-versions test reads the newest tag
          # reachable from this commit, and the default shallow fetch reaches
          # none. It refuses to pass on an empty tag list rather than waving
          # the table through, so the gate needs the history here.
          fetch-depth: 0

      # A squash merge of a caught-up branch commits the tree its pull request head
      # already gated, so main reruns nothing when that head's Gate passed. Any
      # answer short of that (no pull request, a different tree, gh missing on the
      # runner, an API error) runs the full gate.
      - name: Find a passed gate on the same tree
        id: same_tree
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-same-tree.sh "${{ github.repository }}" "${{ github.sha }}"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.same_tree.outputs.passed != 'true'
        with:
          go-version-file: go.mod

      # Pinned rather than floating for the same reason the actions above are:
      # a linter that changes under us turns an unrelated pull request red.
      - name: Install gate tools
        if: steps.same_tree.outputs.passed != 'true'
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Build and gate
        if: steps.same_tree.outputs.passed != 'true'
        run: make build && make check

      - name: Example project checks
        if: steps.same_tree.outputs.passed != 'true'
        run: cd examples && ../bin/drover check
