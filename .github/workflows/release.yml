name: Release

on:
  push:
    tags: ["v*"]

# Creating the release and uploading its assets is the only write a tag needs.
permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The Makefile stamps VERSION from `git describe --tags`, which needs
          # the tag and the history behind it. The default shallow fetch has
          # neither, and would stamp every artifact `dev`.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Pinned rather than floating for the same reason the actions above are:
      # a linter that changes under us turns an unrelated tag red.
      - name: Install gate tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      # Before anything exists to publish. A tag that fails here stops the job,
      # so it produces no artifacts rather than artifacts nobody gated.
      - name: Build and gate
        run: make build && make check

      - name: Build release artifacts
        run: make dist

      # The point of the whole pipeline is a downloaded binary that answers
      # `drover version` in full, so assert that on the one artifact this runner
      # can execute rather than trusting the ldflags went where they were aimed.
      - name: Artifacts name their build
        run: |
          bin="dist/drover_${GITHUB_REF_NAME}_linux_amd64"
          "$bin" version
          "$bin" version | grep -qx "drover ${GITHUB_REF_NAME}"
          "$bin" version | grep -q '^  commit: [0-9a-f]\{7,\}$'
          "$bin" version | grep -q '^  built:  [0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}T'

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
